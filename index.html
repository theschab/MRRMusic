<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRR Music - Bot Muzyczny na Discorda</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            width: 100%;
            max-height: 300px;
            overflow: hidden;
        }
        header img {
            width: 100%;
            height: auto;
            object-fit: cover;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 3px solid #ff5500;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #ff5500;
        }
        p {
            font-size: 1.1rem;
            color: #a0a0a0;
            max-width: 600px;
            margin-bottom: 30px;
        }
        .btn {
            background-color: #ff5500;
            color: white;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #e04a00;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #141414;
            color: #777;
            font-size: 0.9rem;
        }
        footer a {
            color: #ff5500;
            margin: 0 10px;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <img src="baner.png" alt="Baner MRR Music">
    </header>

    <div class="container">
        <img src="logo.png" alt="Logo MRR Music" class="logo">
        <h1>MRR Music</h1>
        <p>Najlepszy bot muzyczny dla Twojego serwera Discord. Płynne odtwarzanie, wysoka jakość dźwięku i łatwa obsługa w jednym miejscu.</p>
        <a href="https://discord.com/oauth2/authorize?client_id=TOWOJ_CLIENT_ID" class="btn" target="_blank">Dodaj do Discorda</a>
    </div>

    <footer>
        <p>&copy; 2026 MRR Music. Wszelkie prawa zastrzeżone.</p>
        <div style="margin-top: 10px;">
            <a href="tos.html">Warunki Korzystania</a> | 
            <a href="privacy.html">Polityka Prywatności</a>
        </div>
    </footer>

</body>
</html>
